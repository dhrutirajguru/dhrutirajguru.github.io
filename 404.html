<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // This repo serves one app at the root (currently TalentSync) plus a few
      // older projects kept in their own subfolders. A path is only treated as
      // a deep link into a subfolder project when its first segment names one
      // of those subfolders below; every other unmatched path is treated as a
      // deep link into whatever app lives at the root, so this file doesn't
      // need to change if the root content changes later.
      var subfolderProjects = ["talentsync", "star-defenders", "version1", "version2"];

      var l = window.location;
      var segments = l.pathname.split("/").filter(Boolean);
      var keepFirstSegment = segments.length > 0 && subfolderProjects.indexOf(segments[0]) !== -1;
      var pathSegmentsToKeep = keepFirstSegment ? 1 : 0;

      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body>
    <p>Page not found.</p>
  </body>
</html>
