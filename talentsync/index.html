<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <title>TalentSync</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Restores the deep-link path that 404.html encoded into ?p= before
      // React Router reads the URL, so refreshing/opening a nested route
      // under /talentsync/ (which GitHub Pages otherwise 404s) still works.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

  </body>
